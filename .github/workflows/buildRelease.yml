name: BuildRelease

on:
  push:
    branches:
      - master
    paths:
      - "src/version.json"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Override release version (optional - uses version.json if empty)"
        required: false
        type: string
      create_draft:
        description: "Create draft release (default: true). Set to false to publish immediately"
        required: false
        type: boolean
        default: true

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - id: set-version
        env:
          INPUT_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          # Use manual input version if provided, otherwise use version.json
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version=$(python -c 'import sys, json; f=open("./version.json");print(json.loads(f.read())["releaseVersion"])')
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Using version: $version"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          if [ -f ../requirements.txt ]; then pip3 install -r ../requirements.txt; fi

      - name: Create Ascent Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ./start.py

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python ./version_tracker.py -o="release_notes.md"

      - name: Create Release
        run: |
          set -x
          assets=()
          for asset in ./*.zip; do
            if [ -f "$asset" ]; then
              assets+=("$asset")
            fi
          done

          # Always create draft releases by default
          # Can be overridden to published by setting create_draft to false in manual runs
          draft_flag=()
          if [ "$INPUT_CREATE_DRAFT" != "false" ]; then
            draft_flag=("--draft")
          fi

          tag="v${{ steps.set-version.outputs.version }}"

          # Use generated release notes if available, otherwise use simple message
          if [ -f "release_notes.md" ]; then
            notes_flag=("--notes-file" "release_notes.md")
          else
            notes_flag=("--notes" "Release $tag")
          fi

          # Re-running for an existing tag updates the release instead of failing
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
            fi
            gh release edit "$tag" "${notes_flag[@]}" --title "$tag"
          else
            gh release create "$tag" "${assets[@]}" "${draft_flag[@]}" --title "$tag" "${notes_flag[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CREATE_DRAFT: ${{ github.event.inputs.create_draft }}

      - name: Commit Version Tracking File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [ -f "last_component_versions.json" ]; then
            git add last_component_versions.json
            git diff --staged --quiet || git commit -m "Update component version tracking [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
